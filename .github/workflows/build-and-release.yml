name: Build and publish image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verimath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MODEL_ENABLED: "false"
      CORPUS_WHITELIST: corpus/curated/public_main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -e ".[test,linalg]"
      - run: python -m pytest -q

  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve release tags
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          python -m scripts.image_tags --image "$image" --tag "$RELEASE_TAG" --revision "$GITHUB_SHA" > "$RUNNER_TEMP/image-tags"
          {
            echo "image=$image"
            echo "tags<<IMAGE_TAGS"
            cat "$RUNNER_TEMP/image-tags"
            echo "IMAGE_TAGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: verimath-agent:smoke
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check startup, bundled corpus and persistent data
        run: python -m scripts.container_smoke verimath-agent:smoke
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish verified image
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag verimath-agent:smoke "$tag"
            docker push "$tag"
          done < "$RUNNER_TEMP/image-tags"
