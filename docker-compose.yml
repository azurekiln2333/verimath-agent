name: verimath-agent

# Production pulls a published image. Local builds use docker-compose.build.yml.
# Run: docker compose --env-file .env.docker up -d --pull always
services:
  xiaoyi:
    image: "${VERIMATH_IMAGE:-docker.cnb.cool/azurekiln/verimath-agent:latest}"
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    environment:
      DATA_DIR: /data
    ports:
      - "${VERIMATH_BIND_HOST:-127.0.0.1}:${VERIMATH_PORT:-8765}:8765"
    volumes:
      - ./data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-verimath-agent}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  watchtower:
    image: nickfedor/watchtower:1.23.2
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "${COMPOSE_PROJECT_NAME:-verimath-agent}"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-600}"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-verimath-agent}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
