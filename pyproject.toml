[project]
name = "xiaoyi-a2a-stat-tutor"
version = "0.1.0"
description = "Local POC for a Xiaoyi A2A statistical learning tutor."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "sse-starlette>=2,<3",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "respx>=0.21,<1",
]
load = [
    "locust>=2.29,<3",
]
vector = [
    "chromadb>=0.5,<1",
]
linalg = [
    "sympy>=1.13",
]
ocr = [
    "paddleocr>=2.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
